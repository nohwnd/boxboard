name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      tag:
        description: 'Tag name for release'
        type: string
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Bevdox.slnx -bl:restore.binlog

      - name: Build
        run: dotnet build Bevdox.slnx -c Release --no-restore -bl:build.binlog

      - name: Test assignments, persistence, discovery and WPF UI
        run: dotnet test Boxboard.Tests/Boxboard.Tests.csproj -c Release --no-build --logger trx -bl:test.binlog

      - name: Publish Boxboard (self-contained)
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) }}
        run: |
          $version = '0.0.0-dev'
          if ($env:RELEASE_TAG -match '^v(\d+\.\d+\.\d+)$') {
            $version = $Matches[1]
          } elseif ($env:RELEASE_TAG) {
            throw "Invalid release tag: $env:RELEASE_TAG"
          }
          dotnet publish Boxboard/Boxboard.csproj -c Release -r win-x64 --self-contained "-p:Version=$version" -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/boxboard -bl:publish-boxboard.binlog

      - name: Bundle portable app and license notices
        shell: pwsh
        run: |
          $files = @(
            'publish/boxboard/Boxboard.exe'
            'publish/boxboard/LICENSE.txt'
            'publish/boxboard/THIRD_PARTY_LICENSE.txt'
          )
          Compress-Archive -LiteralPath $files -DestinationPath publish/Boxboard-win-x64.zip

      - name: Upload Boxboard build artifact
        uses: actions/upload-artifact@v4
        with:
          name: boxboard-win-x64
          path: |
            publish/boxboard/Boxboard.exe
            publish/boxboard/LICENSE.txt
            publish/boxboard/THIRD_PARTY_LICENSE.txt
            publish/Boxboard-win-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            publish/boxboard/Boxboard.exe
            publish/boxboard/LICENSE.txt
            publish/boxboard/THIRD_PARTY_LICENSE.txt
            publish/Boxboard-win-x64.zip
          generate_release_notes: true
